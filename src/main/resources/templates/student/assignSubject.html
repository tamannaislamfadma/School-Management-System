<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Assign Subjects</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div layout:fragment="content">
    <div class="main_container">
        <div class="col-md-12">
            <div class="right_col" role="main">
                <div class="col-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><b>Assign Subjects</b></h2>
                            <div class="clearfix"></div>
                        </div>

                        <div class="x_content">
                            <!-- 🔍 Search Student Form (WITHOUT AJAX) -->
                            <form action="/student/searchStudent" method="GET">
                                <div class="form-group">
                                    <label for="studentId">Search by Student ID:</label>
                                    <input type="number" id="studentId" name="studentId" class="form-control" placeholder="Enter Student ID">
                                </div>

                                <div class="form-group">
                                    <label for="studentName">Or Search by Name:</label>
                                    <input type="text" id="studentName" name="studentName" class="form-control" placeholder="Enter Student Name">
                                </div>

                                <button type="submit" class="btn btn-primary">Search</button>
                            </form>

                            <!-- ❌ Show Error if No Student Found -->
                            <div th:if="${error}" class="alert alert-danger mt-3">
                                <p th:text="${error}"></p>
                            </div>

                            <!-- 📋 Display Student Details -->
                            <div th:if="${student}" class="mt-4">
                                <h3>Student Information</h3>
                                <table class="table table-bordered">
                                    <tbody>
                                    <tr>
                                        <th>ID</th>
                                        <td th:text="${student.id}"></td>
                                    </tr>
                                    <tr>
                                        <th>Name</th>
                                        <td th:text="${student.name}"></td>
                                    </tr>
                                    <tr>
                                        <th>Class</th>
                                        <td th:text="${student.classCode != null ? student.classCode : 'N/A'}"></td>
                                    </tr>
                                    </tbody>
                                </table>

                                <!-- 🎓 Assign Subject Form -->
                                <div class="mt-3">
                                    <h4>Assign Subject</h4>
                                    <form method="POST" action="/student/assignSubject">
                                        <input type="hidden" name="studentId" th:value="${student.id}">

                                        <div class="form-group">
                                            <label for="subjectSelect">Select Subject:</label>
                                            <select id="subjectSelect" name="subjectId" class="form-control" required>
                                                <option>Subjects</option>
                                                <option th:each="subject : ${subjects}"
                                                        th:value="${subject.subjectId}"
                                                        th:text="${subject.subjectName}">
                                                </option>
                                            </select>
                                        </div>

                                        <button type="submit" class="btn btn-success">Assign Subject</button>
                                    </form>
                                </div>
                            </div>

                            <!-- ✅ Success Message -->
                            <div  class="alert alert-success mt-3">
                                <p>Subject successfully assigned!</p>
                            </div>

                            <!-- 📚 Assigned Subjects Table -->
                            <div class="table-responsive mt-4">
                                <h3>Assigned Subjects</h3>
                                <table>
                                    <thead>
                                    <tr>
                                        <th>Subject ID</th>
                                        <th>Subject Name</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="enrollment : ${assignments}">
                                        <td th:text="${enrollment.getSubjectCode()}"></td>
                                        <td th:text="${enrollment.getSubjectName()
                                        }"></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>

                        </div> <!-- x_content -->
                    </div> <!-- x_panel -->
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
