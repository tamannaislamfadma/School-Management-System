<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Add Section</title>
</head>
<body>

<div layout:fragment="content">
    <div class="main_container">
        <div class="col-md-12">
            <div class="right_col" role="main">
                <div class="col-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2>Create New Section</h2>

                        </div>

                        <form th:action="@{/student/saveSection}" th:object="${section}" method="post">
                            <div class="form-group col-md-12">
                                <div class="col-md-4">
                                    <label for="sectionName" class="form-label">Section Name</label>
                                    <input type="text" th:field="*{sectionName}" class="form-control" id="sectionName" required />
                                </div>

                                <div class="col-md-4">
                                    <label for="sectionCode" class="form-label">Section Code</label>
                                    <select th:field="*{sectionCode}" class="form-control" id="sectionCode" required>
                                        <option value="">Select Section</option>
                                        <option value="A">A</option>
                                        <option value="B">B</option>
                                        <option value="C">C</option>
                                        <option value="D">D</option>
                                        <option value="E">E</option>
                                        <option value="F">F</option>
                                        <option value="G">G</option>
                                        <option value="H">H</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary">Save Section</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
