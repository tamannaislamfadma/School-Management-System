<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Add Class</title>
</head>
<body>

<div layout:fragment="content">
    <div class="main_container">
        <div class="col-md-12">
            <div class="right_col" role="main">
                <div class="col-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2>Create New Class</h2>

                        </div>

                        <form th:action="@{/student/saveClass}" th:object="${class}" method="post">
                            <div class="form-group col-md-12">
                                <div class="form-group col-md-4">
                                    <label for="className" class="form-label">Class Name</label>
                                    <input type="text" th:field="*{className}" class="form-control" id="className" required />
                                </div>



                                <div class="form-group col-md-12">
                                    <div class="form-group col-md-4">
                                        <label for="classCode" class="form-label">Class</label>
                                        <select th:field="*{classLookup.classCode}" class="form-control" id="classCode" required>
                                            <option value="">Select Class</option>
                                            <option th:each="class:${classes}"
                                                    th:value="${class.className}"
                                                    th:text="${class.className}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            <button type="submit" class="btn btn-primary">Save Class</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
