<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Edit Routine</title>
</head>
<body>
<div layout:fragment="content">
    <div class="main_container">
        <div class="col-md-12">
            <div class="right_col" role="main">
                <div class="col-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><b>Edit Routine</b></h2>
                            <div style="text-align: right;">
                                <a th:href="@{/student/routinelist}" class="btn btn-outline-success btn-sm">Routine Lists</a>
                            </div>
                            <div class="clearfix"></div>
                        </div>

                        <form th:action="@{/student/updateroutine/{id}(id=${routine.id})}" method="post" th:object="${routine}">

                            <div class="form-group row">
                                <div class="col-md-6">
                                    <label>Class</label>
                                    <input type="text" class="form-control" th:field="*{className}" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label>Section</label>
                                    <input type="text" class="form-control" th:field="*{sectionName}" readonly>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Course / Subject Name</label>
                                <input type="text" class="form-control" th:field="*{courseName}" required>
                            </div>

                            <div class="form-group">
                                <label>Period / Time</label>
                                <input type="text" class="form-control" th:field="*{period}" required>
                            </div>

                            <button type="submit" class="btn btn-primary">Update Routine</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
