<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Edit Seat Plan</title>
</head>
<body>
<div layout:fragment="content">
    <div class="main_container">
        <div class="col-md-12">
            <div class="right_col" role="main">
                <div class="col-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><b>Edit Seat Plan</b></h2>
                            <div style="text-align: right;">
                                <a th:href="@{/student/seatplanlist}" class="btn btn-outline-success btn-sm">Seat Plan
                                    List</a>
                            </div>
                            <div class="clearfix"></div>
                        </div>

                        <form th:action="@{/seatPlan/edit/{id}(id=${seatPlan.id})}" th:object="${seatPlan}"
                              method="post" id="seatPlanForm">

                            <input type="hidden" name="id" th:value="${seatPlan.id}"/>
                            <input type="hidden" name="activeStatus" value="1"/>
                            <input type="hidden" name="classId" id="selectedClassId" th:value="${seatPlan.className}"/>
                            <input type="hidden" name="sectionId" id="selectedSectionId"
                                   th:value="${seatPlan.sectionName}"/>

                            <div class="form-group">
                                <label>Class</label>
                                <select class="form-control" name="className" id="classId" required>
                                    <option value="">Select Class</option>
                                    <option th:each="class : ${classList}"
                                            th:value="${class.id}"
                                            th:text="${class.className}">
                                    </option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Section</label>
                                <select class="form-control" name="sectionName" id="sectionId" required>
                                    <option value="">Select Section</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Exam Name</label>
                                <select class="form-control" name="examName" required>
                                    <option value="">Select Exam</option>
                                    <option value="Mid Term" th:selected="${seatPlan.examName == 'Mid Term'}">Mid Term
                                    </option>
                                    <option value="Final Exam" th:selected="${seatPlan.examName == 'Final Exam'}">Final
                                        Exam
                                    </option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Year</label>
                                <select class="form-control" name="year" required>
                                    <option value="">Select Year</option>
                                    <th:block th:each="num : ${#numbers.sequence(1970,2050)}">
                                        <option th:value="${num}" th:text="${num}"
                                                th:selected="(${num} == ${seatPlan.year})"></option>
                                    </th:block>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Roll Number</label>
                                <select class="form-control" name="roll" required>
                                    <option value="">Select Roll</option>
                                    <th:block th:each="num : ${#numbers.sequence(1,100)}">
                                        <option th:value="${num}" th:text="${num}"
                                                th:selected="(${num} == ${seatPlan.roll})"></option>
                                    </th:block>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary">Update Seat Plan</button>
                        </form>

                        <script>
                            $(document).ready(function () {
                                function loadSections(className) {
                                    var sectionDropdown = $('#sectionId');
                                    sectionDropdown.empty().append('<option value="">Loading Section...</option>');

                                    if (className && className !== "Select Class") {
                                        $.ajax({
                                            url: '/teacher/findSectionByClassName/' + className,
                                            type: 'GET',
                                            dataType: 'json',
                                            success: function (sections) {
                                                sectionDropdown.empty().append('<option value="">Select Section</option>');

                                                if (sections && sections.length > 0) {
                                                    $.each(sections, function (index, section) {
                                                        sectionDropdown.append('<option value="' + section.sectionId + '" ' + (section.sectionId == '${seatPlan.sectionId}' ? 'selected' : '') + '>' + section.sectionName + '</option>');
                                                    });
                                                }
                                            },
                                            error: function (xhr, status, error) {
                                                console.error("AJAX error:", error);
                                                sectionDropdown.empty().append('<option value="">Error loading sections</option>');
                                            }
                                        });
                                    } else {
                                        sectionDropdown.empty().append('<option value="">Select Section</option>');
                                    }
                                }

                                $('#classId').change(function () {
                                    var className = $("#classId option:selected").text();
                                    $('#selectedClassId').val($(this).val());
                                    loadSections(className);
                                }).trigger('change');

                                $('#sectionId').change(function () {
                                    $('#selectedSectionId').val($(this).val());
                                });

                                $('#seatPlanForm').submit(function (event) {
                                    var classId = $('#selectedClassId').val();
                                    var sectionId = $('#selectedSectionId').val();

                                    if (!classId || !sectionId) {
                                        alert("Please select a class and section.");
                                        event.preventDefault();
                                    }
                                });
                            });
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
