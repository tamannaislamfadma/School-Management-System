    <link th:href="@{/build/css/custom.min.css}" rel="stylesheet">

    <link th:href="@{/css/custom.css}" rel="stylesheet">
    <link th:href="@{/css/custom_1.css}" rel="stylesheet">

    <link th:href="@{/vendors/datatables.net-bs/css/dataTables.bootstrap.min.css}" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap4.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<body class="nav-md">
<div class="container body">
    <div class="main_container">

        <div sec:authorize="hasRole('ADMIN')" th:replace="~{fragments/sidebar_admin :: sidebar}"></div>
        <div sec:authorize="hasRole('TEACHER')" th:replace="~{fragments/sidebar_teacher :: sidebar}"></div>
        <div sec:authorize="hasRole('STUDENT')" th:replace="~{fragments/sidebar_student :: sidebar}"></div>

        <div th:replace="~{fragments/header :: header}"></div>

        <div class="right_col" role="main" layout:fragment="content">
            <h1 layout:fragment="title">Page Title</h1>
            <div layout:fragment="content">
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>

<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
