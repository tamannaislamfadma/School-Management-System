<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - School Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 h-screen flex items-center justify-center">

<div class="bg-white rounded-2xl shadow-2xl overflow-hidden flex w-full max-w-4xl h-[550px]"> <div class="hidden md:flex w-1/2 bg-slate-900 items-center justify-center p-8 relative">
    <div class="absolute w-64 h-64 bg-slate-800 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
    <img th:src="@{/images/logox.png}" alt="School Logo" class="relative z-10 w-full max-w-[250px] object-contain drop-shadow-lg">
</div>

    <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">

        <div class="text-center mb-6">
            <h2 class="text-3xl font-bold text-gray-800">Welcome Back!</h2>
            <p class="text-gray-500 text-sm mt-1">Select your role to login</p>
        </div>

        <div th:if="${param.error}" class="bg-red-50 text-red-600 text-sm p-3 rounded-lg mb-4 text-center border border-red-100">
            Invalid Credentials. Please check your Role, ID, and Password.
        </div>
        <div th:if="${param.logout}" class="bg-green-50 text-green-600 text-sm p-3 rounded-lg mb-4 text-center border border-green-100">
            Logged out successfully
        </div>
        <div th:if="${param.signupSuccess}" class="bg-blue-50 text-blue-600 text-sm p-3 rounded-lg mb-4 text-center border border-blue-100">
            Registration successful! Please login.
        </div>

        <form th:action="@{/login}" method="post" autocomplete="off" class="space-y-4">

            <div>
                <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Select Role</label>
                <div class="relative">
                    <select id="role" name="role" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all appearance-none bg-white">
                        <option value="ADMIN">Admin</option>
                        <option value="TEACHER">Teacher</option>
                        <option value="STUDENT">Student</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>

            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">User ID</label>
                <input type="text" id="username" name="username"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                       placeholder="Enter your ID" required>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                       placeholder="Enter password" required>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md mt-2">
                Login
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <p class="text-gray-600">
                Don't have an account?
                <a th:href="@{/signup}" class="text-blue-600 font-semibold hover:underline">Admin Register</a>
            </p>
        </div>

    </div>
</div>

</body>
</html>
