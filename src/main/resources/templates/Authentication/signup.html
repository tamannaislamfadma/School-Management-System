<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 h-screen flex items-center justify-center">

<div class="bg-white rounded-2xl shadow-2xl overflow-hidden flex w-full max-w-4xl h-[500px]">

    <div class="hidden md:flex w-1/2 bg-slate-900 items-center justify-center p-8 relative">
        <div class="absolute w-64 h-64 bg-slate-800 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse"></div>
        <img th:src="@{/images/logox.png}" alt="School Logo" class="relative z-10 w-full max-w-[250px] object-contain drop-shadow-lg">
    </div>

    <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">

        <div class="text-center mb-6">
            <h2 class="text-3xl font-bold text-gray-800">Admin Registration</h2>
            <p class="text-gray-500 text-sm mt-1">Create a new administrator account</p>
        </div>

        <form th:action="@{/signup}" method="post" th:object="${user}" autocomplete="off" class="space-y-4">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="userName"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                       placeholder="Choose a username" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="passWord"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                       placeholder="Choose a password" required>
            </div>

            <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md mt-4">
                Register Admin
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <p class="text-gray-600">
                Already have an account?
                <a th:href="@{/login}" class="text-blue-600 font-semibold hover:underline">Sign In</a>
            </p>
        </div>

    </div>
</div>

</body>
</html>
