<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Payment Entry</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div layout:fragment="content">
    <div class="main_container">
        <div class="col-md-12">
            <div class="right_col" role="main">
                <div class="x_panel">
                    <div class="x_title">
                        <h2><b>Student Payment Entry</b></h2>
                        <div style="text-align: right;">
                            <a th:href="@{/payment/list}" class="btn btn-outline-success btn-sm">Payment List</a>
                        </div>
                        <div class="clearfix"></div>
                    </div>

                    <form th:action="@{/payment/save}" method="post" th:object="${payment}">
                        <input type="hidden" th:field="*{id}" />

                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>Student Name</label>
                                <select name="studentId" class="form-control" required>
                                    <option value="">Select Student</option>
                                    <option th:each="stu : ${students}"
                                            th:value="${stu.id}"
                                            th:text="${stu.name}"
                                            th:selected="${payment.student != null and payment.student.id == stu.id}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Month</label>
                                <select th:field="*{month}" class="form-control" required>
                                    <option value="">Select Month</option>
                                    <option value="January">January</option>
                                    <option value="February">February</option>
                                    <option value="March">March</option>
                                    <option value="April">April</option>
                                    <option value="May">May</option>
                                    <option value="June">June</option>
                                    <option value="July">July</option>
                                    <option value="August">August</option>
                                    <option value="September">September</option>
                                    <option value="October">October</option>
                                    <option value="November">November</option>
                                    <option value="December">December</option>
                                </select>
                            </div>
                        </div>

                        <hr>
                        <h4>Fee Details</h4>

                        <div class="row">
                            <div class="col-md-3 form-group">
                                <label>Admission Fee</label>
                                <input type="number" step="0.01" th:field="*{admissionFee}" class="form-control fee-input" placeholder="0.00">
                            </div>
                            <div class="col-md-3 form-group">
                                <label>Tuition Fee</label>
                                <input type="number" step="0.01" th:field="*{tuitionFee}" class="form-control fee-input" placeholder="0.00">
                            </div>
                            <div class="col-md-3 form-group">
                                <label>Lab Fee</label>
                                <input type="number" step="0.01" th:field="*{labFee}" class="form-control fee-input" placeholder="0.00">
                            </div>
                            <div class="col-md-3 form-group">
                                <label>Extra Curricular Fee</label>
                                <input type="number" step="0.01" th:field="*{extraCurricularFee}" class="form-control fee-input" placeholder="0.00">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-3 form-group">
                                <label>Campus Dev. Fee</label>
                                <input type="number" step="0.01" th:field="*{developmentFee}" class="form-control fee-input" placeholder="0.00">
                            </div>
                            <div class="col-md-3 form-group">
                                <label>Library Fee</label>
                                <input type="number" step="0.01" th:field="*{libraryFee}" class="form-control fee-input" placeholder="0.00">
                            </div>
                            <div class="col-md-3 form-group">
                                <label>Exam Fee</label>
                                <input type="number" step="0.01" th:field="*{examFee}" class="form-control fee-input" placeholder="0.00">
                            </div>
                            <div class="col-md-3 form-group">
                                <label>Insurance Fee</label>
                                <input type="number" step="0.01" th:field="*{insuranceFee}" class="form-control fee-input" placeholder="0.00">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>Others</label>
                                <input type="number" step="0.01" th:field="*{others}" class="form-control fee-input" placeholder="0.00">
                            </div>
                            <div class="col-md-6 form-group">
                                <label style="font-weight: bold; font-size: 16px;">Total Amount</label>
                                <input type="number" step="0.01" th:field="*{totalAmount}" id="totalAmount" class="form-control" readonly style="background-color: #e9ecef; font-weight: bold;">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary mt-3">Save Payment</button>

                    </form>

                    <script>
                        $(document).ready(function() {
                            $(".fee-input").on("input", function() {
                                var total = 0;
                                $(".fee-input").each(function() {
                                    var val = parseFloat($(this).val());
                                    if (!isNaN(val)) {
                                        total += val;
                                    }
                                });
                                $("#totalAmount").val(total.toFixed(2));
                            });
                        });
                    </script>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
