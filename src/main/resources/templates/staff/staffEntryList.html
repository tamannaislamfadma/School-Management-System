<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Staff Entry List</title>
    <style>
        .staff-image {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto;
            display: block;
        }
    </style>
</head>
<body>

<div layout:fragment="content">
    <div class="main_container">
        <div class="col-md-12">
            <div class="right_col" role="main">
                <div class="col-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><b>Staff Entry List</b></h2>
                            <div style="text-align: right;">
                                <a th:href="@{/staff/addStaff}" class="btn btn-outline-success btn-sm">Add New Staff</a>
                            </div>
                            <div class="clearfix"></div>
                        </div>

                        <div class="x_content">
                            <div class="table-responsive">
                                <table class="table table-bordered">
                                    <thead>
                                    <tr>
                                        <th>#</th>
<!--                                        <th>ID</th>-->
                                        <th>Name (English)</th>
                                        <th>Name (Bangla)</th>
                                        <th>Position</th>
                                        <th>Mobile Number</th>
                                        <th>Email Address</th>
                                        <th>Staff Image</th>
                                        <th>Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="staff, iterStat : ${staffEntryList}">
                                        <td th:text="${iterStat.count}"></td>
<!--                                        <td th:text="${staff.id}"></td>-->
                                        <td th:text="${staff.nameEnglsih}"></td>
                                        <td th:text="${staff.nameBangla}"></td>
                                        <td th:text="${staff.position}"></td>
                                        <td th:text="${staff.mobileNumber}"></td>
                                        <td th:text="${staff.emailAddress}"></td>
                                        <td>
                                            <img th:src="@{${staff.stuffImage}}" alt="Staff Image" class="staff-image">
                                        </td>
                                        <td>
                                            <a th:href="@{/staff/editStaffEntry/{id}(id=${staff.id})}"><i
                                                    class="fa fa-edit"></i></a>
                                            <a th:href="@{/staff/deleteStaffEntry/{id}(id=${staff.id})}"
                                               onclick="return confirm('Are you sure?')">
                                                <i class="fa fa-trash" aria-hidden="true"></i>
                                            </a>
                                            <a href="#" data-toggle="modal"
                                               th:attr="data-target='#staffDetailsModal' + ${iterStat.index}">
                                                <i class="fa fa-info-circle" aria-hidden="true"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${staffEntryList == null || staffEntryList.isEmpty()}">
                                        <td colspan="8" class="text-center">No data available in table</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- Modal for Staff Details -->
                            <div th:each="staff, iterStat : ${staffEntryList}" class="modal fade"
                                 th:id="'staffDetailsModal' + ${iterStat.index}" tabindex="-1" role="dialog"
                                 aria-labelledby="staffDetailsModalLabel" aria-hidden="true">
                                <div class="modal-dialog modal-lg" role="document">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title" id="staffDetailsModalLabel">Staff Details</h5>
                                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                                <span aria-hidden="true">&times;</span>
                                            </button>
                                        </div>

                                        <div class="modal-body">
                                            <div class="text-center">
                                                <img th:src="@{${staff.stuffImage}}" alt="Staff Image"
                                                     class="staff-image">
                                            </div>
                                            <table class="table table-bordered mt-3">
                                                <tbody>
                                                <tr>
                                                    <th>ID</th>
                                                    <td th:text="${staff.id}"></td>
                                                </tr>
                                                <tr>
                                                    <th>Name (English)</th>
                                                    <td th:text="${staff.nameEnglsih}"></td>
                                                </tr>
                                                <tr>
                                                    <th>Name (Bangla)</th>
                                                    <td th:text="${staff.nameBangla}"></td>
                                                </tr>
                                                <tr>
                                                    <th>Position</th>
                                                    <td th:text="${staff.position}"></td>
                                                </tr>
                                                <tr>
                                                    <th>Mobile Number</th>
                                                    <td th:text="${staff.mobileNumber}"></td>
                                                </tr>
                                                <tr>
                                                    <th>Email Address</th>
                                                    <td th:text="${staff.emailAddress}"></td>
                                                </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12">
                                    <p>Showing 1 to <span th:text="${staffEntryList.size()}"></span> of <span
                                            th:text="${staffEntryList.size()}"></span> entries</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
