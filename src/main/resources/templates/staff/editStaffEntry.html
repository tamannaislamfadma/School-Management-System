<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Edit Staff Entry</title>
</head>
<body>
<div layout:fragment="content">
    <div class="main_container">
        <div class="col-md-12">
            <div class="right_col" role="main">
                <div class="col-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><b>Edit Staff Entry</b></h2>
                            <div style="text-align: right;">
                                <a th:href="@{/staff/list}" class="btn btn-outline-success btn-sm">Staff List</a>
                            </div>
                            <div class="clearfix"></div>
                        </div>

                        <form th:action="@{/staff/updateStaffEntry/{id}(id=${staffEntry.id})}" method="post"
                              th:object="${staffEntry}">
                            <input type="hidden" name="id" th:value="${staffEntry.id}">

                            <div class="form-group col-md-12">
                                <div class="row">
                                    <div class="form-group col-md-6">
                                        <label for="nameEnglish">Name (English)</label>
                                        <input type="text" th:field="*{nameEnglsih}" class="form-control"
                                               id="nameEnglish" placeholder="Enter Name in English" required>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="nameBangla">Name (Bangla)</label>
                                        <input type="text" th:field="*{nameBangla}" class="form-control" id="nameBangla"
                                               placeholder="Enter Name in Bangla">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="form-group col-md-6">
                                        <label for="position">Position</label>
                                        <input type="text" th:field="*{position}" class="form-control" id="position"
                                               placeholder="Enter Position" required>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="mobileNumber">Mobile Number</label>
                                        <input type="text" th:field="*{mobileNumber}" class="form-control"
                                               id="mobileNumber" placeholder="Enter Mobile Number" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="form-group col-md-6">
                                        <label for="emailAddress">Email Address</label>
                                        <input type="email" th:field="*{emailAddress}" class="form-control"
                                               id="emailAddress" placeholder="Enter Email Address" required>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group col-md-12">
                                <button type="submit" class="btn btn-primary">Update Staff Entry</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
