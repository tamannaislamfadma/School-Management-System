<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Online Admission - Captain Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Online Admission Application</h4>
                </div>
                <div class="card-body p-4">

                    <form th:action="@{/admission/submit}" method="post" enctype="multipart/form-data" th:object="${application}">

                        <h5 class="text-secondary mb-3">Student Information</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Student Full Name</label>
                                <input type="text" class="form-control" th:field="*{studentName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Applying For Class</label>
                                <select class="form-select" th:field="*{applyingClass}">
                                    <option value="6">Class 6</option>
                                    <option value="7">Class 7</option>
                                    <option value="8">Class 8</option>
                                    <option value="9">Class 9</option>
                                    <option value="10">Class 10</option>
                                </select>
                            </div>
                        </div>

                        <h5 class="text-secondary mb-3 mt-4">Guardian Information</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Father's Name</label>
                                <input type="text" class="form-control" th:field="*{fatherName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Mother's Name</label>
                                <input type="text" class="form-control" th:field="*{motherName}" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Mobile Number</label>
                                <input type="tel" class="form-control" th:field="*{mobileNumber}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email (Optional)</label>
                                <input type="email" class="form-control" th:field="*{email}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Present Address</label>
                            <textarea class="form-control" th:field="*{address}" rows="2"></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Student Photo (Passport Size)</label>
                            <input type="file" name="studentPhoto" class="form-control" accept="image/*" required>
                            <small class="text-muted">Max size: 5MB</small>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">Submit Application</button>
                            <a href="/" class="btn btn-outline-secondary">Back to Home</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
