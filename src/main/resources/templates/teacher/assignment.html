<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Assign Teacher to Class</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div layout:fragment="content">
    <div class="main_container">
        <div class="col-md-12">
            <div class="right_col" role="main">
                <div class="col-12">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2>Assign Teacher to Class</h2>
                            <div style="text-align: right;">
                                <a th:href="@{/teacher/view}" class="btn btn-outline-success btn-sm">Enrolled Teacher Lists</a>
                            </div>
                            <div class="clearfix"></div>
                        </div>

                        <div class="x_content">
                            <form th:action="@{/teacher/assignment}" method="post" class="form-horizontal form-label-left">

                                <!-- Class Selection -->
                                <div class="form-group row">
                                    <label for="classId" class="col-form-label col-md-3 col-sm-3 label-align">Class</label>
                                    <div class="col-md-6 col-sm-6">
                                        <select class="form-control" id="classId" required>
                                            <option value="">Select Class</option>
                                            <option th:each="class : ${classList}" th:value="${class.id}" th:text="${class.className}"></option>

                                        </select>
                                        <input type="hidden" name="classId" id="selectedClassId">
                                    </div>
                                </div>



                                <!-- Dynamic Section Selection -->
                                <div class="form-group row">
                                    <label for="sectionId" class="col-form-label col-md-3 col-sm-3 label-align">Section</label>
                                    <div class="col-md-6 col-sm-6">
                                        <select name="sectionId" class="form-control" id="sectionId" required>
                                            <option value="">Select Section</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Dynamic Course Selection -->
                                <div class="form-group row">
                                    <label for="courseId" class="col-form-label col-md-3 col-sm-3 label-align">Course</label>
                                    <div class="col-md-6 col-sm-6">
                                        <select name="courseId" class="form-control" id="courseId" required>
                                            <option value="">Select Course</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Teacher Selection -->
                                <div class="form-group row">
                                    <label for="teacherId" class="col-form-label col-md-3 col-sm-3 label-align">Select Teacher</label>
                                    <div class="col-md-6 col-sm-6">
                                        <select name="teacherId" class="form-control" id="teacherId" required>
                                            <option value="">Select Teacher</option>
                                            <option th:each="teacher : ${teacherList}" th:value="${teacher.id}" th:text="${teacher.name}"></option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Submit Button -->
                                <div class="form-group row">
                                    <div class="col-md-6 col-sm-6 offset-md-3">
                                        <button type="submit" class="btn btn-primary">Assign Teacher</button>

                                    </div>
                                </div>

                            </form>

                            <!-- Custom JavaScript -->

                            <script>
                                $(document).ready(function() {
                                    // Handle class dropdown change event
                                    $('form #classId').change(function() {
                                        var classId = $(this).val();
                                        var className = $("#classId option:selected").text();

                                        // Set the hidden class ID field
                                        $('#selectedClassId').val(classId);

                                        // Clear and populate section dropdown
                                        var sectionDropdown = $('#sectionId');
                                        sectionDropdown.empty().append('<option value="">Loading...</option>');

                                        if (className && className !== "Select Class") {
                                            $.ajax({
                                                url: '/teacher/findSectionByClassName/' + className,
                                                type: 'GET',
                                                dataType: 'json',
                                                success: function(sections) {
                                                    sectionDropdown.empty().append('<option value="">Select Section</option>');

                                                    if (sections && sections.length > 0) {
                                                        $.each(sections, function(index, section) {
                                                            sectionDropdown.append('<option value="' + section.sectionId + '">' + section.sectionName + '</option>');
                                                        });
                                                    }
                                                },
                                                error: function(xhr, status, error) {
                                                    console.error("AJAX error:", error);
                                                    sectionDropdown.empty().append('<option value="">Error loading sections</option>');
                                                }
                                            });
                                        } else {
                                            sectionDropdown.empty().append('<option value="">Select Section</option>');
                                        }

                                        // Clear and populate course dropdown
                                        var courseDropdown = $('#courseId');
                                        courseDropdown.empty().append('<option value="">Loading...</option>');

                                        if (className && className !== "Select Class") {
                                            $.ajax({
                                                url: '/teacher/findCourseByClassName/' + className,
                                                type: 'GET',
                                                dataType: 'json',
                                                success: function(courses) {
                                                    courseDropdown.empty().append('<option value="">Select Course</option>');

                                                    if (courses && courses.length > 0) {
                                                        $.each(courses, function(index, course) {
                                                            courseDropdown.append('<option value="' + course.courseId + '">' + course.courseName + '</option>');
                                                        });
                                                    }
                                                },
                                                error: function(xhr, status, error) {
                                                    console.error("AJAX error:", error);
                                                    courseDropdown.empty().append('<option value="">Error loading courses</option>');
                                                }
                                            });
                                        } else {
                                            courseDropdown.empty().append('<option value="">Select Course</option>');
                                        }
                                    });
                                });
                            </script>
                         </div>
                    </div>
                 </div>
             </div>
        </div>
    </div>
</div>

</body>
</html>
