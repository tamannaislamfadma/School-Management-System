# ===============================
# Application Name
# ===============================
spring.application.name=School-Management-System

# ===============================
# Server Configuration
# ===============================
server.port=8085

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/school_management_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Tjo#219Tan#212

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Thymeleaf (Frontend Engine)
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ===============================
# Static Resources & File Uploads
# ===============================
# This tells Spring where to find your CSS, JS, and uploaded images
spring.web.resources.static-locations=classpath:/static/,file:src/main/resources/static/uploads/

# This is the variable used in your Controller to save files
file.upload.dir=src/main/resources/static/uploads/

# Upload Size Limits (Increased to 50MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Tomcat Server Limits
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=100MB
server.tomcat.max-parameter-count=10000

# ===============================
# Security Configuration
# ===============================
# We have ENABLED security now.
# Do not add "spring.security.enabled=false" here again, or logins will break.
spring.security.enabled=true

# ===============================
# Twilio WhatsApp Configuration
# ===============================
# REPLACE THE TEXT BELOW WITH YOUR ACTUAL KEYS
twilio.account.sid=YOUR_SID
twilio.auth.token=YOUR_TOKEN